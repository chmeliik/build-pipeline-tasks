---
- op: add
  path: /spec/description
  value: |
    This pipeline is ideal for building container images from a Containerfile while maintaining trust after pipeline customization.

    _Uses `buildah` to create a container image leveraging [trusted artifacts](https://konflux-ci.dev/architecture/ADR/0036-trusted-artifacts.html). It also optionally creates a source image and runs some build-time tests. Information is shared between tasks using OCI artifacts instead of PVCs. EC will pass the [`trusted_task.trusted`](https://conforma.dev/docs/policy/packages/release_trusted_task.html#trusted_task__trusted) policy as long as all data used to build the artifact is generated from trusted tasks.
    This pipeline is pushed as a Tekton bundle to [quay.io](https://quay.io/repository/konflux-ci/tekton-catalog/pipeline-docker-build-oci-ta?tab=tags)_
- op: replace
  path: /metadata/name
  value: docker-build-oci-ta
- op: replace
  path: /metadata/labels
  value:
    "pipelines.openshift.io/used-by": "build-cloud"
    "pipelines.openshift.io/runtime": "generic"
    "pipelines.openshift.io/strategy": "docker"
- op: remove
  path: /spec/workspaces/0
# Order of Tasks from the base docker-build Pipeline:
# $ kustomize build pipelines/docker-build | yq .spec.tasks.[].name | nl -v 0
#   0  init
#   1  clone-repository
#   2  prefetch-dependencies
#   3  build-container
#   4  build-image-index
#   5  build-source-image
#   6  deprecated-base-image-check
#   7  clair-scan
#   8  ecosystem-cert-preflight-checks
#   9  sast-snyk-check
#  10  clamav-scan
#  11  sast-shell-check
#  12  sast-unicode-check
#  13  apply-tags
#  14  push-dockerfile

# clone-repository Task
- op: replace
  path: /spec/tasks/1/taskRef/params
  value:
  - name: name
    value: git-clone-oci-ta
  - name: bundle
    value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.4@sha256:df3c42d78223f07b40a84dd29e5c8860d14777ffdf150ea08c738770f51216dc
  - name: kind
    value: task
- op: add
  path: /spec/tasks/1/params/-
  value:
    name: ociStorage
    value: $(params.output-image).git
- op: add
  path: /spec/tasks/1/params/-
  value:
    name: ociArtifactExpiresAfter
    value: $(params.image-expires-after)
- op: remove
  path: /spec/tasks/1/workspaces/0

# prefetch-dependencies Task
- op: replace
  path: /spec/tasks/2/taskRef/params
  value:
  - name: name
    value: prefetch-dependencies-oci-ta
  - name: bundle
    value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies-oci-ta:0.10.1@sha256:c09c1c3ced67fb8740b2925a7de09c0810d4e8c8f148d41c21ffe37810d85c62
  - name: kind
    value: task
- op: add
  path: /spec/tasks/2/params/-
  value:
    name: SOURCE_ARTIFACT
    value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
- op: add
  path: /spec/tasks/2/params/-
  value:
    name: ociStorage
    value: $(params.output-image).prefetch
- op: add
  path: /spec/tasks/2/params/-
  value:
    name: ociArtifactExpiresAfter
    value: $(params.image-expires-after)
- op: remove
  path: /spec/tasks/2/workspaces/0

# build-container
- op: replace
  path: /spec/tasks/3/taskRef/params
  value:
  - name: name
    value: buildah-oci-ta
  - name: bundle
    value: quay.io/konflux-ci/tekton-catalog/task-buildah-oci-ta:0.10.5@sha256:5fcf620537b0dece56a9c9a8090ce7592a874da92cc2a5d398abdc2382eb8a3c
  - name: kind
    value: task
- op: add
  path: /spec/tasks/3/params/-
  value:
    name: SOURCE_ARTIFACT
    value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
- op: add
  path: /spec/tasks/3/params/-
  value:
    name: CACHI2_ARTIFACT
    value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
- op: remove
  path: /spec/tasks/3/workspaces/0

# build-source-image
- op: replace
  path: /spec/tasks/5/taskRef/params
  value:
  - name: name
    value: source-build-oci-ta
  - name: bundle
    value: quay.io/konflux-ci/tekton-catalog/task-source-build-oci-ta:0.3@sha256:7c5575ac8e292f27f57716c021ab0324460dc958e73946724c588c5228e5f372
  - name: kind
    value: task
- op: add
  path: /spec/tasks/5/params/-
  value:
    name: SOURCE_ARTIFACT
    value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
- op: add
  path: /spec/tasks/5/params/-
  value:
    name: CACHI2_ARTIFACT
    value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
- op: remove
  path: /spec/tasks/5/workspaces/0

# sast-snyk-check
- op: test
  path: /spec/tasks/9/taskRef/params/0/value
  value: sast-snyk-check
- op: replace
  path: /spec/tasks/9/taskRef/params
  value:
  - name: name
    value: sast-snyk-check-oci-ta
  - name: bundle
    value: quay.io/konflux-ci/tekton-catalog/task-sast-snyk-check-oci-ta:0.5@sha256:eba24f5d9f4b18aa71e523b9b3dbcf22982aa4b018824260a090b19dfc9abf6f
  - name: kind
    value: task
- op: add
  # In the docker-build Pipeline, the snyk Task does not receive any parameters, so we cannot
  # append to it.
  path: /spec/tasks/9/params/-
  value:
    name: SOURCE_ARTIFACT
    value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
- op: add
  path: /spec/tasks/9/params/-
  value:
    name: CACHI2_ARTIFACT
    value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
- op: remove
  path: /spec/tasks/9/workspaces/0

# sast-shell-check
- op: test
  path: /spec/tasks/11/taskRef/params/0/value
  value: sast-shell-check
- op: replace
  path: /spec/tasks/11/taskRef/params
  value:
  - name: name
    value: sast-shell-check-oci-ta
  - name: bundle
    value: quay.io/konflux-ci/tekton-catalog/task-sast-shell-check-oci-ta:0.1@sha256:61b27e6ad5daba761d41bb37efb790ed98380603fd4fe2f86d156def5bd72ecc
  - name: kind
    value: task
- op: add
  path: /spec/tasks/11/params/-
  value:
    name: SOURCE_ARTIFACT
    value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
- op: add
  path: /spec/tasks/11/params/-
  value:
    name: CACHI2_ARTIFACT
    value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
- op: remove
  path: /spec/tasks/11/workspaces/0

# sast-unicode-check
- op: test
  path: /spec/tasks/12/taskRef/params/0/value
  value: sast-unicode-check
- op: replace
  path: /spec/tasks/12/taskRef/params
  value:
  - name: name
    value: sast-unicode-check-oci-ta
  - name: bundle
    value: quay.io/konflux-ci/tekton-catalog/task-sast-unicode-check-oci-ta:0.4@sha256:eb9d5392f215cb8b52b16382098cac4885b1e6cd989f88ebd83fdb234d283eb9
  - name: kind
    value: task
- op: add
  path: /spec/tasks/12/params/-
  value:
    name: SOURCE_ARTIFACT
